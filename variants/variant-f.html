<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEADX — Variante F — Funnel Anime</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Neue Haas Grotesk Display Pro", "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: #fff;
    color: #1a1a1a;
    min-height: 100vh;
    overflow: hidden;
    position: relative;
  }

  .hero {
    position: relative;
    width: 100%;
    height: 100vh;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Dot grid */
  .dot-grid {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image: radial-gradient(rgba(0,0,0,0.06) 1px, transparent 1px);
    background-size: 28px 28px;
    z-index: 0;
  }

  /* Funnel canvas */
  .funnel-canvas {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }

  /* Radial glow at convergence */
  .funnel-glow {
    position: absolute;
    bottom: 6%;
    left: 50%;
    transform: translateX(-50%);
    width: 240px;
    height: 180px;
    background: radial-gradient(ellipse, rgba(255,38,0,0.14) 0%, rgba(255,38,0,0.05) 40%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
    z-index: 1;
  }

  /* Flowing pills */
  .flow-pill {
    position: absolute;
    font-size: 11px;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 20px;
    background: rgba(255,38,0,0.08);
    border: 1px solid rgba(255,38,0,0.15);
    color: #FF2600;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    z-index: 3;
    will-change: transform, opacity;
    transform: translate(-50%, -50%);
  }

  /* Pop-out notification cards */
  .popout-card {
    position: absolute;
    left: 50%;
    pointer-events: none;
    z-index: 3;
    background: #fff;
    border-radius: 12px;
    padding: 10px 18px;
    font-size: 13px;
    font-weight: 600;
    color: #1a1a1a;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04);
    white-space: nowrap;
    opacity: 0;
    transform: translateX(-50%) scale(0);
    will-change: transform, opacity;
  }

  /* Static floating bubbles */
  .static-bubble {
    position: absolute;
    background: #fff;
    border-radius: 14px;
    padding: 12px 20px;
    font-size: 13px;
    font-weight: 600;
    color: #1a1a1a;
    box-shadow: 0 4px 24px rgba(0,0,0,0.07), 0 1px 3px rgba(0,0,0,0.03);
    pointer-events: none;
    z-index: 2;
    white-space: nowrap;
  }

  .sb-1 { top: 12%; left: 5%;  animation: gentleFloat 4s ease-in-out infinite; }
  .sb-2 { top: 16%; right: 4%; animation: gentleFloat 4.5s ease-in-out 1s infinite; }
  .sb-3 { bottom: 20%; left: 6%;  animation: gentleFloat 5s ease-in-out 0.5s infinite; }
  .sb-4 { bottom: 26%; right: 5%; animation: gentleFloat 4.2s ease-in-out 1.5s infinite; }

  @keyframes gentleFloat {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }

  /* Main content */
  .hero-content {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 40px 20px;
  }

  .hero-logo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 56px;
    height: 56px;
    background: #FF2600;
    border-radius: 14px;
    margin-bottom: 28px;
    box-shadow: 0 4px 20px rgba(255,38,0,0.25);
  }

  .hero-logo svg {
    width: 28px;
    height: 28px;
    fill: #fff;
  }

  .hero-title {
    font-size: clamp(48px, 8vw, 88px);
    font-weight: 800;
    letter-spacing: -3px;
    line-height: 1;
    color: #1a1a1a;
    margin-bottom: 16px;
  }

  .hero-subtitle {
    font-size: clamp(16px, 2.5vw, 22px);
    font-weight: 400;
    color: #888;
    letter-spacing: -0.3px;
  }

  /* ---- Responsive ---- */
  @media (max-width: 640px) {
    .sb-3, .sb-4 { display: none; }
    .static-bubble { font-size: 11px; padding: 8px 14px; }
    .popout-card { font-size: 11px; padding: 8px 14px; }
    .funnel-glow { width: 140px; height: 120px; }
  }
</style>
</head>
<body>

<section class="hero" id="hero">

  <div class="dot-grid"></div>

  <!-- SVG Funnel drawn by JS for responsiveness -->
  <canvas class="funnel-canvas" id="funnelCanvas"></canvas>

  <div class="funnel-glow"></div>

  <!-- Static floating bubbles -->
  <div class="static-bubble sb-1">Nouveau prospect 🔥</div>
  <div class="static-bubble sb-2">+47 leads/mois</div>
  <div class="static-bubble sb-3">ROI x3</div>
  <div class="static-bubble sb-4">Campagne active 🚀</div>

  <!-- Main content -->
  <div class="hero-content">
    <div class="hero-logo">
      <svg viewBox="0 0 24 24"><path d="M13 3L4 14h7l-2 7 9-11h-7l2-7z"/></svg>
    </div>
    <h1 class="hero-title">LEADX</h1>
    <p class="hero-subtitle">Variante F — Funnel Animé</p>
  </div>

</section>

<script>
(function() {
  const hero = document.getElementById('hero');
  const canvas = document.getElementById('funnelCanvas');
  const ctx = canvas.getContext('2d');

  let W, H;
  // Funnel geometry (in viewport coords)
  // Left curve:  from (leftTopX, topY) via control point to (centerX, bottomY)
  // Right curve: from (rightTopX, topY) via control point to (centerX, bottomY)

  function getFunnel() {
    const cx = W / 2;
    const topY = H * 0.06;
    const bottomY = H * 0.88;
    const spread = Math.min(W * 0.42, 420);
    const ctrlY = H * 0.50;
    return {
      left: {
        x0: cx - spread, y0: topY,
        cx: cx - spread * 0.15, cy: ctrlY,
        x1: cx, y1: bottomY
      },
      right: {
        x0: cx + spread, y0: topY,
        cx: cx + spread * 0.15, cy: ctrlY,
        x1: cx, y1: bottomY
      },
      centerX: cx,
      bottomY: bottomY
    };
  }

  function resize() {
    W = hero.offsetWidth;
    H = hero.offsetHeight;
    canvas.width = W * devicePixelRatio;
    canvas.height = H * devicePixelRatio;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    drawFunnel();
  }

  function drawFunnel() {
    ctx.clearRect(0, 0, W, H);
    const f = getFunnel();

    // Fill
    ctx.beginPath();
    ctx.moveTo(f.left.x0, f.left.y0);
    ctx.quadraticCurveTo(f.left.cx, f.left.cy, f.left.x1, f.left.y1);
    ctx.quadraticCurveTo(f.right.cx, f.right.cy, f.right.x0, f.right.y0);
    ctx.closePath();

    const grad = ctx.createLinearGradient(0, f.left.y0, 0, f.left.y1);
    grad.addColorStop(0, 'rgba(255,38,0,0.03)');
    grad.addColorStop(1, 'rgba(255,38,0,0.10)');
    ctx.fillStyle = grad;
    ctx.fill();

    // Stroke left curve
    ctx.beginPath();
    ctx.moveTo(f.left.x0, f.left.y0);
    ctx.quadraticCurveTo(f.left.cx, f.left.cy, f.left.x1, f.left.y1);
    ctx.strokeStyle = 'rgba(255,38,0,0.2)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Stroke right curve
    ctx.beginPath();
    ctx.moveTo(f.right.x0, f.right.y0);
    ctx.quadraticCurveTo(f.right.cx, f.right.cy, f.right.x1, f.right.y1);
    ctx.stroke();
  }

  // Quadratic bezier point at t
  function bezierPoint(p0x, p0y, cpx, cpy, p1x, p1y, t) {
    const u = 1 - t;
    return {
      x: u * u * p0x + 2 * u * t * cpx + t * t * p1x,
      y: u * u * p0y + 2 * u * t * cpy + t * t * p1y
    };
  }

  // ---- FLOWING PILLS ----
  const pillLabels = ['Prospect', 'Visiteur', 'Contact', 'Lead', 'Entreprise',
                       'Prospect', 'Contact', 'Visiteur', 'Lead', 'Entreprise'];
  const pillSides  = ['left','left','left','left','left',
                       'right','right','right','right','right'];
  const pillDelays = [0, 1500, 3000, 4500, 6000, 800, 2300, 3800, 5300, 6800];
  const pillDuration = 4500; // ms
  const pillCycle = 8000; // total cycle before repeating

  const isMobile = window.innerWidth <= 640;
  const pillCount = isMobile ? 4 : 10;
  const mobileIndices = [0, 1, 5, 6]; // 2 left + 2 right

  const pills = [];
  for (let i = 0; i < pillCount; i++) {
    const idx = isMobile ? mobileIndices[i] : i;
    const el = document.createElement('div');
    el.className = 'flow-pill';
    el.textContent = pillLabels[idx];
    hero.appendChild(el);
    pills.push({ el, side: pillSides[idx], delay: pillDelays[idx] });
  }

  function updatePills(now) {
    const f = getFunnel();
    pills.forEach(p => {
      const elapsed = ((now - p.delay) % pillCycle + pillCycle) % pillCycle;
      if (elapsed > pillDuration) {
        p.el.style.opacity = 0;
        return;
      }
      const t = elapsed / pillDuration; // 0..1
      const curve = p.side === 'left' ? f.left : f.right;
      const pos = bezierPoint(curve.x0, curve.y0, curve.cx, curve.cy, curve.x1, curve.y1, t);

      // Fade in first 10%, fade out last 10%
      let alpha = 1;
      if (t < 0.1) alpha = t / 0.1;
      else if (t > 0.85) alpha = (1 - t) / 0.15;

      p.el.style.opacity = alpha;
      p.el.style.left = pos.x + 'px';
      p.el.style.top = pos.y + 'px';
    });
  }

  // ---- POP-OUT NOTIFICATIONS ----
  const popTexts = [
    '+1 200€ 💰',
    'Client signé ✅',
    'RDV confirmé 📅',
    'Paiement reçu 🎉',
    '+1 lead qualifié 🎯'
  ];
  const popDelay = 3000; // gap between each
  const popDuration = 2800;
  const popCycle = popTexts.length * popDelay;

  const popCards = [];
  popTexts.forEach(txt => {
    const el = document.createElement('div');
    el.className = 'popout-card';
    el.textContent = txt;
    hero.appendChild(el);
    popCards.push(el);
  });

  function easeOutBack(t) {
    const c1 = 1.70158;
    const c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }

  function updatePopouts(now) {
    const f = getFunnel();
    const baseY = f.bottomY + 20;
    popCards.forEach((el, i) => {
      const elapsed = ((now - i * popDelay) % popCycle + popCycle) % popCycle;
      if (elapsed > popDuration) {
        el.style.opacity = 0;
        return;
      }
      const t = elapsed / popDuration;
      // Phase 1: pop in (0-20%), Phase 2: visible (20-75%), Phase 3: fade+drift (75-100%)
      let scale, alpha, dy;
      if (t < 0.15) {
        const p = t / 0.15;
        scale = easeOutBack(p);
        alpha = p;
        dy = 0;
      } else if (t < 0.7) {
        scale = 1;
        alpha = 1;
        dy = 0;
      } else {
        const p = (t - 0.7) / 0.3;
        scale = 1 - p * 0.1;
        alpha = 1 - p;
        dy = p * 30;
      }

      el.style.opacity = alpha;
      el.style.top = (baseY + dy) + 'px';
      el.style.transform = `translateX(-50%) scale(${scale})`;
    });
  }

  // ---- ANIMATION LOOP ----
  let startTime = null;
  function frame(ts) {
    if (!startTime) startTime = ts;
    const now = ts - startTime;
    updatePills(now);
    updatePopouts(now);
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
